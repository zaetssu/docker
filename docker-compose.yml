services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    env_file:
      - .env
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app_data: